<div class="grid">
  @if (user$ | async; as user) {
  <h1 class="title">Accueil</h1>
  <div class="user-info">
    <span>Bienvenue, {{ user.username }}</span>
  </div>
  <section class="home__container grid grid--cols-2 grid--gap-12">
      @if (isAdventureVisible && (draftSession || !user.drafted)) {
        <app-adventure
          class="col-span-2"
          [draftSession]="draftSession"
          [userId]="user._id"
          (draftDone)="onDraftDone()"></app-adventure>
      } @else {
        <mat-card appearance="filled" class="card-primary col-span-2">
          <mat-card-content>
          <app-adventure-status
              [user]="user"
              [countdown]="countdown"
              [isHydrating]="(isHydrating$ | async) || isDraftLoading"
              (ctaClicked)="showAdventure()"
            ></app-adventure-status>
        </mat-card-content>
        </mat-card>

        <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title>Derniers évènements</mat-card-title>
          <mat-card-subtitle>Test sous-titre</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div>
            test
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title>Dernières actions</mat-card-title>
          <mat-card-subtitle>Test sous-titre</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div>
            test
          </div>
        </mat-card-content>
      </mat-card>
      }

  </section>
}
</div>
