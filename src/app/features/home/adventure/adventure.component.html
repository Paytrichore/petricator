@if (!storyDone) {
  <app-story
    [externalStory]="question"
    (storyReady)="onStoryReady($event)"
    (choiceSelected)="onChoiceSelected($event)"></app-story>
} @else {
  @if (draftSession; as session) {
    <app-peblob-draft [draftSession]="session" (draftDone)="draftDone.emit($event)">
      <h2>{{ story?.result }}</h2>
    </app-peblob-draft>
  }
}
