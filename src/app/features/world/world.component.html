<div class="world">
  <header class="world__status" aria-live="polite">
    <span>{{ (connected$ | async) ? 'Monde connecté' : 'Connexion au monde...' }}</span>
    @if (loading$ | async) {
      <span>Synchronisation...</span>
    }
  </header>

  <app-pixi-map
    [cells]="(cells$ | async) ?? []"></app-pixi-map>
</div>
